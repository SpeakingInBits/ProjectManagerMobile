[package]
name = "project-app"
description = "Project Manager for iOS, Android and desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# cdylib for Android (loaded by NativeActivity); rlib so the desktop/iOS binary can link it.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "project-manager"
path = "src/main.rs"

[dependencies]
project-core = { path = "../core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "accessibility"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-femtovg", "renderer-software"] }
dirs = "6"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-android-activity-06", "renderer-femtovg"] }

[target.'cfg(target_os = "ios")'.dependencies]
# Slint's iOS support goes through winit + the Skia renderer.
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-skia"] }

[build-dependencies]
slint-build = "1.18"
