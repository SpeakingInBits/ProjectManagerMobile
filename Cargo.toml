[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "UNLICENSED"

[profile.release]
# Small, fast binaries for the app stores.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Android debug builds: still optimized so the UI runs smoothly on a device, but without release's
# whole-program optimization, which makes every rebuild take minutes.
[profile.android-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
